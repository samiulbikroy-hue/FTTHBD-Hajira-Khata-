<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="হাজিরা খাতা">
<title>হাজিরা খাতা</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--pr:#2563eb;--g:#d1fae5;--gt:#065f46;--r:#fee2e2;--rt:#991b1b;--y:#fef3c7;--yt:#92400e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1c2127;--tx:#eef0f3;--mu:#9aa3ae;--bd:#2c333b;--pr:#5b8def;--g:#0f3d2e;--gt:#6ee7b7;--r:#4a1d1d;--rt:#fca5a5;--y:#4a3a10;--yt:#fcd34d}}
:root[data-theme="dark"]{--bg:#111418;--card:#1c2127;--tx:#eef0f3;--mu:#9aa3ae;--bd:#2c333b;--pr:#5b8def;--g:#0f3d2e;--gt:#6ee7b7;--r:#4a1d1d;--rt:#fca5a5;--y:#4a3a10;--yt:#fcd34d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali","Kalpurush",sans-serif;font-size:16px}
.w{max-width:480px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.d{background:var(--r);color:var(--rt)}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--bd);color:var(--tx)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.hd{text-align:center;font-size:12px;color:var(--mu)}
.day{aspect-ratio:1;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);padding:0;font-size:14px}
.day.p{background:var(--g);color:var(--gt);border-color:transparent}
.day.a{background:var(--r);color:var(--rt);border-color:transparent;font-weight:700}
.day.l{background:var(--y);color:var(--yt);border-color:transparent}
.day.t{outline:2px solid var(--pr)}
.leg{display:flex;gap:10px;font-size:12px;color:var(--mu);margin-top:10px;flex-wrap:wrap}
.sum div{display:flex;justify-content:space-between;padding:5px 0}
.big{font-size:22px;font-weight:700;color:var(--pr)}
.big2{font-size:20px;padding:16px;width:100%}
.mu{color:var(--mu);font-size:13px}
.hi{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
.hi:last-child{border:0}
#sp{position:fixed;inset:0;z-index:9;background:radial-gradient(circle at 50% 30%,#3b5bdb,#0b1020);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;transition:opacity .6s}
#sp.out{opacity:0;pointer-events:none}
.sc{perspective:800px}
.cd{width:210px;height:250px;border-radius:22px;background:rgba(255,255,255,.15) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:80px;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:spin 2.2s ease-out forwards,fl 3.2s ease-in-out 2.2s infinite}
@keyframes spin{from{transform:rotateY(-540deg) scale(.3)}to{transform:rotateY(0) scale(1)}}
@keyframes fl{0%,100%{transform:rotateY(-14deg) rotateX(5deg) translateY(0)}50%{transform:rotateY(14deg) rotateX(-5deg) translateY(-10px)}}
#sp h2{margin:6px 0 0;font-size:26px}
#sp .b{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35)}
button{box-shadow:0 4px 0 rgba(0,0,0,.28),0 8px 14px rgba(0,0,0,.14);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.14)}
.card{box-shadow:0 2px 0 var(--bd),0 14px 28px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.35);border-radius:18px}
.day{box-shadow:0 3px 0 rgba(0,0,0,.2),0 6px 8px rgba(0,0,0,.1)}
.day:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.grid{perspective:700px}
.big2{font-size:20px;padding:16px;width:100%}
button.d{box-shadow:0 4px 0 #b91c1c55,0 8px 14px rgba(0,0,0,.12);font-weight:600}
.day{background-image:linear-gradient(160deg,rgba(255,255,255,.22),rgba(0,0,0,.1));box-shadow:0 5px 0 rgba(0,0,0,.4),0 10px 14px rgba(0,0,0,.25)}
.day:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.card{transition:transform .15s ease-out;will-change:transform;box-shadow:0 3px 0 var(--bd),0 18px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.chip{background-image:linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.08))}
.t3{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:linear-gradient(145deg,var(--card),var(--bg));border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.38),0 18px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3);transform:perspective(700px) rotateX(5deg);transition:transform .1s,box-shadow .1s}
button.t3:active{transform:perspective(700px) rotateX(5deg) translateY(6px);box-shadow:0 0 0 rgba(0,0,0,.38),0 4px 8px rgba(0,0,0,.28)}
.t3.add{background:linear-gradient(145deg,#5b8def,#1e3fae);color:#fff;border:0;text-align:center;font-size:21px;font-weight:700;padding:22px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.tg .t3{margin:0;text-align:center}
.tg b{display:block;font-size:22px;color:var(--pr);margin-top:4px}
.ini{flex:none;width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#5b8def,#1e3fae);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.er{display:flex;gap:12px;align-items:center}.er .m{flex:1;min-width:0}.er .n{font-size:18px;font-weight:700}
.b3{background:linear-gradient(145deg,#5b8def,#1e3fae);color:#fff;border:0;font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 6px 0 #14297a,0 14px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);transform:perspective(500px) rotateX(8deg)}
.b3:active{transform:perspective(500px) rotateX(8deg) translateY(5px);box-shadow:0 1px 0 #14297a,0 4px 8px rgba(0,0,0,.35)}
.av{box-shadow:0 4px 10px rgba(0,0,0,.3);border:2px solid #fff;width:38px;height:38px;border-radius:50%;object-fit:cover;margin-right:8px;vertical-align:middle}
.t3d{display:flex;gap:6px;perspective:700px;font-size:50px;font-weight:900;justify-content:center;flex-wrap:wrap}
.t3d span{display:inline-block;color:#fff;opacity:0;text-shadow:0 1px 0 #dbe4ff,0 2px 0 #b6c4f0,0 3px 0 #94a6de,0 4px 0 #7488c8,0 5px 0 #566bb0,0 6px 0 #3f5296,0 7px 0 #2d3d78,0 16px 20px rgba(0,0,0,.6);animation:lin 1.2s cubic-bezier(.2,.9,.3,1.2) forwards,lw 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*.15s),calc(1.4s + var(--i)*.15s)}
.t3d.sub{font-size:26px;gap:12px;margin-top:2px}
.t3d.sub span{color:#e0e7ff;text-shadow:0 1px 0 #b6c4f0,0 2px 0 #94a6de,0 3px 0 #7488c8,0 4px 0 #566bb0,0 5px 0 #3f5296,0 10px 14px rgba(0,0,0,.55)}
@keyframes lin{from{opacity:0;transform:rotateY(-540deg) rotateX(60deg) translateZ(-350px) translateY(-70px) scale(.3)}to{opacity:1;transform:rotateY(0) rotateX(0) translateZ(0) translateY(0) scale(1)}}
@keyframes lw{0%,100%{transform:rotateY(0) translateY(0)}25%{transform:rotateY(-22deg) rotateX(8deg) translateY(-5px)}50%{transform:rotateY(0) translateY(-10px)}75%{transform:rotateY(22deg) rotateX(-8deg) translateY(-5px)}}
.ei{flex:none;width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fbbf24,#d97706);color:#fff;border:0;box-shadow:0 5px 0 #92400e,0 10px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55);transform:perspective(400px) rotateX(10deg)}
.ei:active{transform:perspective(400px) rotateX(10deg) translateY(4px);box-shadow:0 1px 0 #92400e,0 3px 6px rgba(0,0,0,.35)}
.ei.on{background:linear-gradient(145deg,#94a3b8,#475569);box-shadow:0 5px 0 #1e293b,0 10px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.45)}
</style>
</head>
<body>
<div id="sp"><div class="sc"><div class="cd" id="cd">👤</div></div><div class="t3d"><span style="--i:0">F</span><span style="--i:1">T</span><span style="--i:2">T</span><span style="--i:3">H</span><span style="--i:4">B</span><span style="--i:5">D</span></div><div class="t3d sub"><span style="--i:6">কর্মচারী</span><span style="--i:7">হাজিরা</span><span style="--i:8">খাতা</span></div><button class="b3" onclick="closeSp()">ড্যাশবোর্ডে যান ›</button></div>
<input type="file" id="ph" accept="image/*" hidden onchange="pickPhoto(this)">
<input type="file" id="ph2" accept="image/*" hidden onchange="pickEmp(this)">
<input type="file" id="ph3" accept="image/*" hidden onchange="pickNew(this)">

var K='hajira_v1',S={mode:null,people:[],rec:{},sel:null};
try{var x=localStorage.getItem(K);if(x)S=JSON.parse(x)}catch(e){}
if(!S.photo)S.photo=DEF;
var now=new Date(),vy=now.getFullYear(),vm=now.getMonth(),A=document.getElementById('app');
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function bn(n){return Math.round(n).toLocaleString('bn-BD')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function cur(){return S.people.find(function(p){return p.id===S.sel})}
function mname(y,m){return new Date(y,m,1).toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}
function setMode(m){S.mode=m;EDIT=false;OPEN=false;ADD=false;window.scrollTo(0,0);if(m==='self'&&!S.people.length){addP('আমি',0)}save();draw()}
function addP(n,sal){var id='p'+Date.now();S.people.push({id:id,name:n,salary:sal});S.rec[id]={};S.sel=id}
function newP(){var n=document.getElementById('nn').value.trim(),s=+document.getElementById('ns').value||0;if(!n){return}addP(n,s);cur().mobile=document.getElementById('mb').value.trim();cur().desig=document.getElementById('dg').value.trim();cur().eid=document.getElementById('idn').value.trim();cur().site=document.getElementById('st').value.trim();if(NP)cur().photo=NP;NP=null;ADD=false;OPEN=false;save();draw()}
function pick(id){S.sel=id;save();draw()}
function sal(){var p=cur();var nm=document.getElementById('nm').value.trim();if(nm)p.name=nm;p.mobile=document.getElementById('mob').value.trim();p.desig=document.getElementById('dg').value.trim();p.eid=document.getElementById('idn').value.trim();p.site=document.getElementById('st').value.trim();p.salary=+document.getElementById('sl').value||0;EDIT=false;save();draw()}
function nav(d){vm+=d;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}draw()}
function tap(d){var r=S.rec[S.sel],k=key(vy,vm,d),v=r[k];if(!v)r[k]='a';else if(v==='a')r[k]='l';else delete r[k];save();draw()}
var DC=false;
function delP(){if(!DC){DC=true;draw();setTimeout(function(){if(DC){DC=false;draw()}},5000);return}DC=false;var id=S.sel;S.people=S.people.filter(function(p){return p.id!==id});delete S.rec[id];S.sel=S.people.length?S.people[0].id:null;OPEN=false;if(S.mode==='self'){S.mode=null}save();draw()}
function reset(){S.mode=null;EDIT=false;OPEN=false;ADD=false;save();draw()}
function draw(){
 if(!S.mode){A.innerHTML='<h1>হাজিরা খাতা</h1><div class="card"><p>আপনি কীভাবে ব্যবহার করবেন?</p><button class="big2" onclick="setMode(\'self\')">আমি নিজের হাজিরা রাখব</button><p></p><button class="big2 s" onclick="setMode(\'boss\')">আমি মালিক, অনেকের হাজিরা রাখব</button></div><p class="mu">সব তথ্য শুধু আপনার ফোনের ব্রাউজারে সেভ থাকে।</p>'+bkHTML();return}
 if(S.mode==='boss'&&!OPEN){dash();return}
 var h='<div class="row"><h1>'+(S.photo?'<img class="av" src="'+S.photo+'">':'')+'FTTHBD হাজিরা খাতা</h1><button class="b3" style="padding:9px 13px;font-size:14px" onclick="reset()">🔄 মোড বদলান</button></div>';
 if(S.mode==='boss'){h+='<button class="b3" onclick="OPEN=false;EDIT=false;draw()">🏠 ড্যাশবোর্ড</button><p></p>'}
 if(false){
  h+='<div class="chips">'+S.people.filter(function(p){return !p.done}).map(function(p){return'<button class="chip'+(p.id===S.sel?' on':'')+'" onclick="pick(\''+p.id+'\')">'+esc(p.name)+'</button>'}).join('')+'</div>';
  h+='<div class="card"><b>নতুন কর্মচারী</b><input id="nn" placeholder="নাম"><input id="mb" type="tel" inputmode="numeric" placeholder="মোবাইল নম্বর"><input id="ns" type="number" inputmode="numeric" placeholder="মাসিক বেতন (টাকা)"><button onclick="newP()">যোগ করুন</button></div>';
 }
 if(false){var dn=S.people.filter(function(q){return q.done});if(dn.length){h+='<div class="card"><b>✅ কাজ শেষ করেছে</b><div class="chips" style="margin-top:8px">'+dn.map(function(q){return'<button class="chip'+(q.id===S.sel?' on':'')+'" onclick="pick(\''+q.id+'\')">'+esc(q.name)+'</button>'}).join('')+'</div><div class="mu">নামে চাপলে তার হিসাব ও ইতিহাস দেখা যাবে</div></div>'}}
 var p=cur();
 if(!p){A.innerHTML=h;return}
 var dim=new Date(vy,vm+1,0).getDate(),first=new Date(vy,vm,1).getDay(),r=S.rec[p.id]||{},rate=p.salary/dim,ab=0,lv=0;
 for(var d=1;d<=dim;d++){var v=r[key(vy,vm,d)];if(v==='a')ab++;else if(v==='l')lv++}
