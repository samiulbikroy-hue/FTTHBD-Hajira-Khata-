name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow
      - name: Set app icon
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          import os, shutil
          src = Image.open('icon.png').convert('RGBA')
          base = 'android/app/src/main/res'
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for k, s in sizes.items():
              d = base + '/mipmap-' + k
              os.makedirs(d, exist_ok=True)
              im = src.resize((s, s), Image.LANCZOS)
              im.save(d + '/ic_launcher.png')
              m = Image.new('L', (s * 4, s * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, s * 4 - 1, s * 4 - 1), fill=255)
              m = m.resize((s, s), Image.LANCZOS)
              r = im.copy()
              r.putalpha(m)
              r.save(d + '/ic_launcher_round.png')
          shutil.rmtree(base + '/mipmap-anydpi-v26', ignore_errors=True)
          print('icons done')
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hajira-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
