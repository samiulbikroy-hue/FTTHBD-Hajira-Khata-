name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android
        run: npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon.png assets/icon-only.png
          npm install --no-audit --no-fund @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hajira-Khata-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
