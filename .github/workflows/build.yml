<body>
<div id="sp"><div class="sc"><div class="cd" id="cd">👤</div></div><div class="t3d"><span style="--i:0">F</span><span style="--i:1">T</span><span style="--i:2">T</span><span style="--i:3">H</span><span style="--i:4">B</span><span style="--i:5">D</span></div><div class="t3d sub"><span style="--i:6">কর্মচারী</span><span style="--i:7">হাজিরা</span><span style="--i:8">খাতা</span></div><div style="display:flex;flex-direction:column;gap:16px;width:250px;margin-top:6px"><button class="b3" style="font-size:18px" onclick="showLogin()">🔐 লগইন করে ঢুকুন</button><button class="b3" style="font-size:18px;background:linear-gradient(145deg,#94a3b8,#334155);box-shadow:0 6px 0 #1e293b,0 14px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)" onclick="closeSp()">📋 ড্যাশবোর্ডে যান ›</button></div></div>
<input type="file" id="ph" accept="image/*" hidden onchange="pickPhoto(this)">
<input type="file" id="ph2" accept="image/*" hidden onchange="pickEmp(this)">
<input type="file" id="ph3" accept="image/*" hidden onchange="pickNew(this)">
<div id="clk" class="clk"><span id="lgbw"></span><span class="tx"><span id="cs"></span> <span id="clkt"></span></span></div><div class="w" id="app"></div><div class="soc" id="socf"></div>
<script>
var DEF='data:image/jpeg;base64,';
var K='hajira_v1',S={mode:null,people:[],rec:{},sel:null};
try{var x=localStorage.getItem(K);if(x)S=JSON.parse(x)}catch(e){}
if(!S.photo||S.photo.indexOf('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAK')===0||S.photo.indexOf('data:image/svg+xml')===0)S.photo=DEF;
var now=new Date(),vy=now.getFullYear(),vm=now.getMonth(),A=document.getElementById('app');try{var _c0=S.people.find(function(p){return p.id===S.sel});if(_c0){var _cp=curPer(_c0);vy=_cp.y;vm=_cp.m}}catch(e){}
function saveLocal(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function save(){S.ts=Date.now();saveLocal();if(window.cloudSoon)cloudSoon()}
function bn(n){return Math.round(n).toLocaleString('bn-BD')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function sdOf(p){if(p&&p.jd){var d=+String(p.jd).split('-')[2];if(d>=1&&d<=31)return d}var n=+(p&&p.sd);return n>=1&&n<=31?Math.floor(n):1}
function pS(p,y,m){return new Date(y,m,Math.min(sdOf(p),new Date(y,m+1,0).getDate()))}
function pDim(p,y,m){var n=m+1,ny=y;if(n>11){n=0;ny++}return Math.round((pS(p,ny,n)-pS(p,y,m))/864e5)}
function pDay(p,y,m,i){var s=pS(p,y,m);return new Date(s.getFullYear(),s.getMonth(),s.getDate()+i)}
function dKey(t){return key(t.getFullYear(),t.getMonth(),t.getDate())}
function pKey(p,y,m,i){return dKey(pDay(p,y,m,i))}
function inP(p,y,m,k){return k>=pKey(p,y,m,0)&&k<=pKey(p,y,m,pDim(p,y,m)-1)}
function curPer(p){var T=new Date(),tk=dKey(T),y=T.getFullYear(),m=T.getMonth(),c=[[y,m],[m?y:y-1,(m+11)%12],[m<11?y:y+1,(m+1)%12]];if(p&&p.jd&&tk<p.jd){var a=p.jd.split('-');return{y:+a[0],m:+a[1]-1}}for(var i=0;i<3;i++){var q=c[i];if(tk>=pKey(p,q[0],q[1],0)&&tk<=pKey(p,q[0],q[1],pDim(p,q[0],q[1])-1))return{y:q[0],m:q[1]}}return{y:y,m:m}}
function fdt(s){var q=String(s).split('-');return new Date(+q[0],+q[1]-1,+q[2]).toLocaleDateString('bn-BD',{day:'numeric',month:'long'})}
function fdy(s){var q=String(s).split('-');return new Date(+q[0],+q[1]-1,+q[2]).toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'})}
function plab(p,y,m){if(sdOf(p)===1)return mname(y,m);var a=pDay(p,y,m,0),b=pDay(p,y,m,pDim(p,y,m)-1),f=function(t){return t.toLocaleDateString('bn-BD',{day:'numeric',month:'long'})};return f(a)+' – '+f(b)+' '+b.toLocaleDateString('bn-BD',{year:'numeric'})}
function setView(p){if(!p)return;var c=curPer(p);vy=c.y;vm=c.m}
function cur(){return S.people.find(function(p){return p.id===S.sel})}
function mname(y,m){return new Date(y,m,1).toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}
function setMode(m){S.mode=m;EDIT=false;OPEN=false;ADD=false;window.scrollTo(0,0);if(m==='self'&&!S.people.length){addP('আমি',0)}save();draw()}
function addP(n,sal){var id='p'+Date.now();S.people.push({id:id,name:n,salary:sal});S.rec[id]={};S.sel=id}
function newP(){var n=document.getElementById('nn').value.trim(),s=+document.getElementById('ns').value||0;if(!n){return}addP(n,s);var jv=document.getElementById('jdn').value||'';if(jv)cur().jd=jv;cur().mobile=document.getElementById('mb').value.trim();cur().wa=document.getElementById('wan').value.trim();cur().desig=document.getElementById('dg').value.trim();cur().eid=document.getElementById('idn').value.trim();cur().site=document.getElementById('st').value.trim();if(NP)cur().photo=NP;NP=null;ADD=false;OPEN=false;setView(cur());save();draw()}
function pick(id){S.sel=id;setView(cur());save();draw()}
function sal(){var p=cur();var nm=document.getElementById('nm').value.trim();if(nm)p.name=nm;p.mobile=document.getElementById('mob').value.trim();p.wa=document.getElementById('wav').value.trim();p.desig=document.getElementById('dg').value.trim();p.eid=document.getElementById('idn').value.trim();p.site=document.getElementById('st').value.trim();p.salary=+document.getElementById('sl').value||0;var jv=document.getElementById('jdv').value||'';if(jv)p.jd=jv;else delete p.jd;delete p.sd;setView(p);EDIT=false;save();draw()}
function nav(d){var p=cur(),oy=vy,om=vm;vm+=d;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}if(p&&p.jd){var a=p.jd.split('-');if(vy*12+vm<(+a[0])*12+(+a[1]-1)){vy=oy;vm=om}}draw()}
