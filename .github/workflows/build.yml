name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ফাইল পরীক্ষা
        run: |
          ls -la
          test -f index.html || { echo "ERROR: index.html নেই"; exit 1; }
          head -c 120 index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: আলাদা ফোল্ডারে প্রজেক্ট বানানো
        run: |
          mkdir -p $HOME/app/www
          cp index.html $HOME/app/www/index.html
          [ -f icon.png ] && cp icon.png $HOME/app/icon.png || true
          cd $HOME/app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Hajira Khata" com.ftthbd.hajira --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's/>Hajira Khata</>হাজিরা খাতা</g' android/app/src/main/res/values/strings.xml || true
      - name: আইকন বসানো
        run: |
          cd $HOME/app
          if [ -f icon.png ]; then
            R=android/app/src/main/res
            rm -rf $R/mipmap-anydpi-v26
            for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${s%%:*}; px=${s##*:}
              convert icon.png -resize ${px}x${px} $R/mipmap-$d/ic_launcher.png
              cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
              cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_foreground.png
            done
          fi
      - name: APK বিল্ড
        run: |
          cd $HOME/app/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hajira-apk
          path: /home/runner/app/android/app/build/outputs/apk/debug/app-debug.apk
