name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: প্রজেক্ট বানানো
        run: |
          mkdir -p $HOME/app/www
          cp index.html $HOME/app/www/index.html
          cp icon.png $HOME/app/icon.png
          cd $HOME/app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Hajira Khata" com.ftthbd.hajira --web-dir=www
          npx cap add android
          npx cap sync android
      - name: আইকন বসানো
        run: |
          sudo apt-get install -y -qq imagemagick
          cd $HOME/app
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; px=${s##*:}
            convert icon.png -resize ${px}x${px} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
          done
      - name: APK বিল্ড
        run: |
          cd $HOME/app/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hajira-apk
          path: /home/runner/app/android/app/build/outputs/apk/debug/app-debug.apk
